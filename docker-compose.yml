services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RETAIL_FORECAST_MODEL: /app/artifacts/model_bundle.joblib
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      RETAIL_FORECAST_MODEL: /app/artifacts/model_bundle.joblib
